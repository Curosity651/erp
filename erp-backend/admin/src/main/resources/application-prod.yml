spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/erp?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${DB_USERNAME:erp}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    password: ${REDIS_PASSWORD:}
    port: ${REDIS_PORT:6379}

# 日志文件地址，配置此属性以便 SBA 在线查看日志
logging:
  file:
    path: logs/@artifactId@
    name: ${logging.file.path}/output.log

# 生产环境关闭文档
ballcat:
  openapi:
    enabled: false

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    path-prefix: ${OSS_PATH_PREFIX:uploads/}
    cdn-domain: ${OSS_CDN_DOMAIN:}
    enable-https: ${OSS_ENABLE_HTTPS:true}
    expire-time: ${OSS_EXPIRE_TIME:3600}

spring:
  datasource:
    url: jdbc:mysql://ballcat-mysql:3306/ballcat?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: '123456'
  redis:
    host: ballcat-redis
    password: ''
    port: 6379

# 日志文件地址，配置此属性以便 SBA 在线查看日志
logging:
  file:
    path: logs/@artifactId@
    name: ${logging.file.path}/output.log

# 生产环境关闭文档
ballcat:
  openapi:
    enabled: false

aliyun:
  oss:
    endpoint: oss-cn-shanghai.aliyuncs.com
    access-key-id: your-access-key-id-here
    access-key-secret: your-access-key-secret-here
    bucket-name: your-bucket-name-here
    path-prefix: uploads/
    cdn-domain: 
    enable-https: true
    expire-time: 3600